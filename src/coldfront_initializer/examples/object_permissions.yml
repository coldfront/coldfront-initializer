# ObjectPermission records define reusable actions + constraints.
# User/group assignments happen in users.yml and groups.yml instead.
#
# Constraint tokens:
#   $user - replaced with the current user's primary key at runtime

# --- Permissions for principal_investigator role ---

projects.rw_owner:
  actions:
    - view
    - add
    - change
    - delete
  description: "Manage your own projects"
  enabled: true
  object_types:
    ras:
      - project
  constraints:
    owner: $user

allocations.ro_owner:
  actions:
    - view
  description: "View allocations on your own projects"
  enabled: true
  object_types:
    ras:
      - allocation
  constraints:
    project__owner: $user

allocations.request:
  actions:
    - request
  description: "Request allocations for your own projects"
  enabled: true
  object_types:
    ras:
      - allocation
  constraints:
    project__owner: $user

allocations.renew_owner:
  actions:
    - renew
  description: "Renew allocations on your own projects"
  enabled: true
  object_types:
    ras:
      - allocation
  constraints:
    project__owner: $user

change_requests.ro_owner:
  actions:
    - view
  description: "View change requests on allocations on your own projects"
  enabled: true
  object_types:
    ras:
      - allocationchangerequest
  constraints:
    allocation__project__owner: $user

change_requests.add_owner:
  actions:
    - add
  description: "Request changes to allocations on your own projects"
  enabled: true
  object_types:
    ras:
      - allocationchangerequest
  constraints:
    allocation__project__owner: $user

project_users.rw_owner:
  actions:
    - view
    - add
    - change
    - delete
  description: "Manage project users for projects you own or belong to"
  enabled: true
  object_types:
    ras:
      - projectuser
  constraints:
    - project__owner: $user
    - project__users__user: $user

users.ro:
  actions:
    - view
  description: "View all users"
  enabled: true
  object_types:
    users:
      - user

project_users.ro:
  actions:
    - view
  description: "View all project users"
  enabled: true
  object_types:
    ras:
      - projectuser

# --- Permissions for center_director role ---

allocations.approve_deny:
  actions:
    - view
    - approve
    - deny
  description: "View, approve, and deny all allocations"
  enabled: true
  object_types:
    ras:
      - allocation

projects.ro:
  actions:
    - view
  description: "View all projects"
  enabled: true
  object_types:
    ras:
      - project

comments.ro:
  actions:
    - view
  description: "View comments on allocations"
  enabled: true
  object_types:
    core:
      - commententry

comments.ro_owner:
  actions:
    - view
  description: "View comments on your own allocations"
  enabled: true
  object_types:
    core:
      - commententry
  constraints:
    assigned_object_type__model: "allocation"
    assigned_object_id__in:
      $queryset:
        model: ras.allocation
        filter:
          project__owner: $user

comments.add:
  actions:
    - add
  description: "Add comments to allocations"
  enabled: true
  object_types:
    core:
      - commententry

comments.add_owner:
  actions:
    - add
  description: "Add comments to your own allocations"
  enabled: true
  object_types:
    core:
      - commententry
  constraints:
    assigned_object_type__model: "allocation"
    assigned_object_id__in:
      $queryset:
        model: ras.allocation
        filter:
          project__owner: $user

comments.own_edit_delete:
  actions:
    - change
    - delete
  description: "Edit and delete your own comments"
  enabled: true
  object_types:
    core:
      - commententry
  constraints:
    created_by: $user

# --- Permissions for physics_reviewer role ---

physics.projects.ro:
  actions:
    - view
  description: "View projects in the Physics tenant"
  enabled: true
  object_types:
    ras:
      - project
  constraints:
    tenant__name: "Physics"

physics.allocations.approve_deny:
  actions:
    - view
    - approve
    - deny
  description: "View, approve, and deny allocations belonging to Physics tenant projects"
  enabled: true
  object_types:
    ras:
      - allocation
  constraints:
    project__tenant__name: "Physics"
