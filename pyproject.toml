[project]
name = "coldfront-initializer"
version = "0.0.9"
description = "Load data into ColdFront from yaml files"
readme = "README.md"
authors = [
    { name = "Andrew E. Bruno", email = "aebruno2@buffalo.edu" }
]
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
keywords = ["high-performance-computing", "resource-allocation"]
classifiers = [
    "Framework :: Django",
    "Environment :: Plugins",
    'Topic :: Scientific/Engineering',
    'Topic :: System :: Systems Administration',
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "ruamel-yaml>=0.19.1",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coldfront",
    "pytest-django>=4.14.0",
    "reuse>=6.2.0",
    "ruff>=0.15.7",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.sources]
coldfront = { git = "https://github.com/coldfront/coldfront", branch = "dev/2.0.x" }

[tool.pytest]
minversion = "9.0"
DJANGO_SETTINGS_MODULE = "coldfront.config.settings"
testpaths = ["tests"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
filterwarnings = [
    'ignore::DeprecationWarning',
]
